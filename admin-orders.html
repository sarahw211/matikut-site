<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>מתיקות — פאנל ניהול (פנימי)</title>
<style>
  :root{
    --brand:#C16802;
    --ink:#393836;
    --cream-0:#FEFDFC;
    --cream-1:#FBF6EF;
    --cream-2:#F3EADD;
    --on-brand:#ECDFCD;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    background:var(--cream-1);
    color:var(--ink);
    min-height:100vh;
  }
  a{color:inherit}

  /* ============ מסך כניסה ============ */
  .gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .gate-card{
    width:100%;
    max-width:400px;
    background:#fff;
    border-radius:20px;
    padding:36px 32px;
    box-shadow:0 8px 30px rgba(57,56,54,.1);
  }
  .gate-card h1{font-size:22px;margin:0 0 6px}
  .gate-card .sub{color:rgba(57,56,54,.6);font-size:14px;margin:0 0 24px;line-height:1.6}
  .gate-tabs{display:flex;gap:8px;margin-bottom:22px;background:var(--cream-2);padding:4px;border-radius:999px}
  .gate-tab{
    flex:1;background:none;border:0;border-radius:999px;padding:9px 0;font-size:14px;cursor:pointer;color:var(--ink);
  }
  .gate-tab.is-active{background:var(--brand);color:#fff}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 14px;border:1px solid rgba(57,56,54,.2);border-radius:10px;
    font-size:15px;font-family:inherit;background:var(--cream-1);
  }
  .field textarea{resize:vertical;min-height:80px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(193,104,2,.35);outline-offset:1px}
  .field-check{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:14px}
  .field-check input{width:auto}
  .field-hint{font-size:12px;color:rgba(57,56,54,.5);margin-top:4px}
  .gate-submit{
    width:100%;margin-top:6px;background:var(--brand);color:#fff;border:0;border-radius:999px;
    padding:13px 0;font-size:15px;cursor:pointer;transition:opacity .2s;
  }
  .gate-submit:disabled{opacity:.5;cursor:not-allowed}
  .gate-msg{font-size:13.5px;line-height:1.6;margin-top:14px;padding:12px 14px;border-radius:10px;display:none}
  .gate-msg.is-error{display:block;background:#FDECEA;color:#B3261E}
  .gate-msg.is-ok{display:block;background:#EAF4E9;color:#2E6B31}

  /* ============ דשבורד ============ */
  .dash{display:none;padding:28px 24px 100px;max-width:1080px;margin:0 auto}
  .dash-head{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;
  }
  .dash-head h1{font-size:24px;margin:0}
  .dash-head .who{font-size:13px;color:rgba(57,56,54,.55);margin-top:2px}
  .logout-btn{
    background:#fff;border:1px solid rgba(57,56,54,.2);border-radius:999px;padding:9px 20px;
    font-size:14px;cursor:pointer;color:var(--ink);
  }
  .logout-btn:hover{background:var(--cream-2)}
  .tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .tab-btn{
    background:#fff;border:1px solid rgba(57,56,54,.15);border-radius:999px;
    padding:10px 22px;font-size:14.5px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:8px;
  }
  .tab-btn.is-active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .tab-btn .badge{
    background:rgba(57,56,54,.12);border-radius:999px;padding:1px 8px;font-size:12px;min-width:20px;text-align:center;
  }
  .tab-btn.is-active .badge{background:rgba(255,255,255,.25)}
  .panel{display:none}
  .panel.is-active{display:block}
  .panel-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .refresh-btn{
    background:#fff;border:1px solid rgba(57,56,54,.15);border-radius:999px;padding:7px 16px;
    font-size:13px;cursor:pointer;color:var(--ink);
  }
  .add-btn{
    background:var(--brand);color:#fff;border:0;border-radius:999px;padding:9px 20px;
    font-size:13.5px;cursor:pointer;
  }
  .empty-state{
    text-align:center;padding:60px 20px;color:rgba(57,56,54,.5);font-size:15px;background:#fff;border-radius:16px;
  }
  .loading-state{text-align:center;padding:40px 20px;color:rgba(57,56,54,.5);font-size:14px}

  .row-card{
    background:#fff;border-radius:16px;padding:20px 22px;margin-bottom:14px;
    box-shadow:0 2px 14px rgba(57,56,54,.06);
  }
  .row-card__top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .row-card__name{font-size:17px;font-weight:700;margin:0}
  .row-card__date{font-size:12.5px;color:rgba(57,56,54,.5);margin-top:3px}
  .row-card__contact{font-size:13.5px;color:rgba(57,56,54,.7);margin-top:8px;display:flex;flex-wrap:wrap;gap:14px}
  .row-card__contact span{white-space:nowrap}
  .status-select{
    border:1px solid rgba(57,56,54,.2);border-radius:999px;padding:6px 12px;font-size:13px;
    background:var(--cream-1);color:var(--ink);cursor:pointer;font-family:inherit;flex:none;
  }
  .status-select[data-status="new"]{border-color:rgba(193,104,2,.5);color:var(--brand)}
  .status-select[data-status="done"]{border-color:rgba(46,107,49,.4);color:#2E6B31}
  .row-card__items{
    margin-top:14px;border-top:1px solid rgba(57,56,54,.1);padding-top:12px;
    display:flex;flex-direction:column;gap:6px;
  }
  .item-line{display:flex;justify-content:space-between;font-size:14px;color:rgba(57,56,54,.8)}
  .item-line b{color:var(--ink)}
  .row-card__total{
    display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;
    border-top:1px solid rgba(57,56,54,.1);font-size:15px;font-weight:700;
  }
  .row-card__notes{
    margin-top:12px;font-size:13.5px;color:rgba(57,56,54,.65);background:var(--cream-2);
    border-radius:10px;padding:10px 14px;line-height:1.5;
  }
  .row-card__source{font-size:12px;color:rgba(57,56,54,.45);margin-top:8px}
  .save-note{font-size:12px;color:#2E6B31;margin-right:6px;opacity:0;transition:opacity .3s}
  .save-note.show{opacity:1}

  /* ============ ניהול תוכן: מוצרים/עלונים/שיעורים ============ */
  .series-bar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border-radius:14px;
    padding:14px 16px;margin-bottom:16px;
  }
  .series-bar__label{font-size:13px;font-weight:600;color:rgba(57,56,54,.6);margin-left:4px}
  .series-chip{
    display:flex;align-items:center;gap:6px;background:var(--cream-2);border-radius:999px;
    padding:6px 8px 6px 14px;font-size:13px;
  }
  .series-chip button{
    border:0;background:rgba(57,56,54,.15);color:var(--ink);border-radius:50%;width:18px;height:18px;
    font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;
  }
  .series-add{display:flex;gap:6px;align-items:center}
  .series-add input{
    border:1px solid rgba(57,56,54,.2);border-radius:999px;padding:6px 14px;font-size:13px;width:160px;
  }
  .series-add button{
    background:var(--ink);color:#fff;border:0;border-radius:999px;padding:6px 16px;font-size:13px;cursor:pointer;
  }

  .cms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .cms-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 14px rgba(57,56,54,.06);display:flex;flex-direction:column}
  .cms-card__thumb{width:100%;aspect-ratio:4/3;background:var(--cream-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cms-card__thumb img{width:100%;height:100%;object-fit:contain}
  .cms-card__thumb .ph{font-size:12px;color:rgba(57,56,54,.4)}
  .cms-card__body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .cms-card__title{font-size:15.5px;font-weight:700;margin:0;line-height:1.35}
  .cms-card__meta{font-size:12.5px;color:rgba(57,56,54,.55)}
  .cms-card__actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}
  .cms-card__actions button{
    flex:1;border:1px solid rgba(57,56,54,.18);background:#fff;border-radius:999px;padding:7px 0;
    font-size:12.5px;cursor:pointer;color:var(--ink);
  }
  .cms-card__actions .del-btn{color:#B3261E;border-color:rgba(179,38,30,.3)}
  .cms-card__actions button:hover{background:var(--cream-2)}

  /* ============ מודאל טופס ============ */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(57,56,54,.45);z-index:200;
    align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;
  }
  .modal-overlay.is-open{display:flex}
  .modal-box{background:#fff;border-radius:20px;padding:28px 26px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal-box h2{font-size:19px;margin:0 0 18px}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions .primary{
    flex:1;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:12px 0;font-size:14.5px;cursor:pointer;
  }
  .modal-actions .primary:disabled{opacity:.5;cursor:not-allowed}
  .modal-actions .secondary{
    background:#fff;border:1px solid rgba(57,56,54,.2);border-radius:999px;padding:12px 22px;font-size:14.5px;cursor:pointer;color:var(--ink);
  }
  .modal-msg{font-size:13px;color:#B3261E;margin-top:10px;display:none}
  .modal-msg.show{display:block}
  .file-current{font-size:12.5px;color:rgba(57,56,54,.55);margin-top:6px;display:flex;align-items:center;gap:8px}
  .file-current img{width:34px;height:34px;object-fit:cover;border-radius:6px;flex:none}
</style>
</head>
<body>

<!-- ============ מסך כניסה ============ -->
<div class="gate" id="gateScreen">
  <div class="gate-card">
    <h1>פאנל ניהול — מתיקות</h1>
    <p class="sub">עמוד פנימי לניהול הזמנות, פניות, מוצרים, עלונים ושיעורי תורה. לא מקושר מהתפריט הציבורי.</p>
    <div class="gate-tabs">
      <button class="gate-tab is-active" data-mode="login">התחברות</button>
      <button class="gate-tab" data-mode="signup">הרשמה ראשונית</button>
    </div>
    <form id="authForm">
      <div class="field">
        <label for="authEmail">אימייל</label>
        <input type="email" id="authEmail" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="authPassword">סיסמה</label>
        <input type="password" id="authPassword" autocomplete="current-password" required minlength="6">
      </div>
      <button type="submit" class="gate-submit" id="authSubmit">התחברות</button>
      <div class="gate-msg" id="authMsg"></div>
    </form>
  </div>
</div>

<!-- ============ דשבורד ============ -->
<div class="dash" id="dashScreen">
  <div class="dash-head">
    <div>
      <h1>פאנל ניהול</h1>
      <div class="who" id="whoEl"></div>
    </div>
    <button class="logout-btn" id="logoutBtn">התנתקות</button>
  </div>

  <div class="tabs">
    <button class="tab-btn is-active" data-tab="orders">הזמנות <span class="badge" id="ordersCount">0</span></button>
    <button class="tab-btn" data-tab="messages">פניות יצירת קשר <span class="badge" id="msgsCount">0</span></button>
    <button class="tab-btn" data-tab="products">מוצרים <span class="badge" id="productsCount">0</span></button>
    <button class="tab-btn" data-tab="leaflets">עלונים <span class="badge" id="leafletsCount">0</span></button>
    <button class="tab-btn" data-tab="lessons">שיעורי תורה <span class="badge" id="lessonsCount">0</span></button>
  </div>

  <div class="panel is-active" id="panel-orders">
    <div class="panel-toolbar"><span></span><button class="refresh-btn" data-refresh="orders">רענון</button></div>
    <div id="ordersList"></div>
  </div>

  <div class="panel" id="panel-messages">
    <div class="panel-toolbar"><span></span><button class="refresh-btn" data-refresh="messages">רענון</button></div>
    <div id="messagesList"></div>
  </div>

  <div class="panel" id="panel-products">
    <div class="panel-toolbar">
      <button class="add-btn" data-add="products">+ הוספת מוצר</button>
      <button class="refresh-btn" data-refresh="products">רענון</button>
    </div>
    <div class="cms-grid" id="productsList"></div>
  </div>

  <div class="panel" id="panel-leaflets">
    <div class="series-bar" id="seriesBar">
      <span class="series-bar__label">סדרות עלונים:</span>
    </div>
    <div class="panel-toolbar">
      <button class="add-btn" data-add="leaflets">+ הוספת עלון</button>
      <button class="refresh-btn" data-refresh="leaflets">רענון</button>
    </div>
    <div class="cms-grid" id="leafletsList"></div>
  </div>

  <div class="panel" id="panel-lessons">
    <div class="panel-toolbar">
      <button class="add-btn" data-add="lessons">+ הוספת שיעור</button>
      <button class="refresh-btn" data-refresh="lessons">רענון</button>
    </div>
    <div class="cms-grid" id="lessonsList"></div>
  </div>
</div>

<!-- ============ מודאל הוספה/עריכה ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <form id="modalForm"></form>
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-actions">
      <button type="button" class="primary" id="modalSave">שמירה</button>
      <button type="button" class="secondary" id="modalCancel">ביטול</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var SUPABASE_URL = 'https://garazmdqwdpxrpzkcneg.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_SFMWTzHxPebh1xTp_zv5tA_zh1x_Xaj';
  var SESSION_KEY = 'matikut_admin_session';

  var gateScreen = document.getElementById('gateScreen');
  var dashScreen = document.getElementById('dashScreen');
  var authForm = document.getElementById('authForm');
  var authEmail = document.getElementById('authEmail');
  var authPassword = document.getElementById('authPassword');
  var authSubmit = document.getElementById('authSubmit');
  var authMsg = document.getElementById('authMsg');
  var mode = 'login';

  /* ---------- מעבר בין התחברות/הרשמה ---------- */
  document.querySelectorAll('.gate-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.gate-tab').forEach(function(b){ b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      mode = btn.dataset.mode;
      authSubmit.textContent = mode === 'login' ? 'התחברות' : 'הרשמה';
      authPassword.setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
      hideMsg();
    });
  });

  function showMsg(text, isError){
    authMsg.textContent = text;
    authMsg.className = 'gate-msg ' + (isError ? 'is-error' : 'is-ok');
  }
  function hideMsg(){
    authMsg.className = 'gate-msg';
    authMsg.textContent = '';
  }

  /* ---------- ניהול session ---------- */
  function saveSession(session){
    var expires_at = Date.now() + (session.expires_in || 3600) * 1000;
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      access_token: session.access_token,
      refresh_token: session.refresh_token,
      expires_at: expires_at,
      email: (session.user && session.user.email) || authEmail.value.trim()
    }));
  }
  function getSession(){
    try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; }
  }
  function clearSession(){ localStorage.removeItem(SESSION_KEY); }

  function refreshSession(session){
    return fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    }).then(function(res){
      if(!res.ok) throw new Error('refresh failed');
      return res.json();
    }).then(function(data){
      saveSession(data);
      return getSession();
    });
  }

  /* מחזירה session תקף (עם access_token עדכני), ומרעננת אם פג תוקף */
  function validSession(){
    var s = getSession();
    if(!s) return Promise.reject(new Error('no session'));
    if(s.expires_at - 30000 > Date.now()) return Promise.resolve(s);
    return refreshSession(s);
  }

  /* ---------- שליחת טופס: התחברות או הרשמה ---------- */
  authForm.addEventListener('submit', function(e){
    e.preventDefault();
    hideMsg();
    var email = authEmail.value.trim();
    var password = authPassword.value;
    authSubmit.disabled = true;

    var endpoint = mode === 'login'
      ? '/auth/v1/token?grant_type=password'
      : '/auth/v1/signup';

    fetch(SUPABASE_URL + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
      body: JSON.stringify({ email: email, password: password })
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(r){
      authSubmit.disabled = false;
      if(mode === 'login'){
        if(!r.ok || !r.data.access_token){
          showMsg('אימייל או סיסמה שגויים.', true);
          return;
        }
        saveSession(r.data);
        enterDashboard();
        return;
      }
      /* מצב הרשמה */
      if(!r.ok){
        var m = (r.data && r.data.msg) || (r.data && r.data.error_description) || 'שגיאה בהרשמה. נסי שוב.';
        if(/already|registered|exists/i.test(m)) m = 'כבר קיים חשבון עם האימייל הזה — עברי ללשונית "התחברות".';
        showMsg(m, true);
        return;
      }
      if(r.data.access_token){
        /* אין דרישת אימות מייל — מחוברת מיד */
        saveSession(r.data);
        enterDashboard();
        return;
      }
      /* נדרש אימות מייל לפני התחברות */
      showMsg('נרשמת בהצלחה! נשלח מייל אישור לכתובת ' + email + '. אחרי שתאשרי אותו, אפשר להתחבר כאן עם הסיסמה שבחרת.', false);
      document.querySelector('.gate-tab[data-mode="login"]').click();
    }).catch(function(){
      authSubmit.disabled = false;
      showMsg('בעיית תקשורת. בדקי חיבור לאינטרנט ונסי שוב.', true);
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    clearSession();
    dashScreen.style.display = 'none';
    gateScreen.style.display = 'flex';
    authForm.reset();
  });

  /* ---------- דשבורד ---------- */
  function enterDashboard(){
    var s = getSession();
    document.getElementById('whoEl').textContent = s ? s.email : '';
    gateScreen.style.display = 'none';
    dashScreen.style.display = 'block';
    loadOrders();
    loadMessages();
    loadProducts();
    loadSeries();
    loadLeaflets();
    loadLessons();
  }

  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('is-active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('is-active'); });
      btn.classList.add('is-active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('is-active');
    });
  });
  document.querySelectorAll('[data-refresh]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var t = btn.dataset.refresh;
      if(t === 'orders') loadOrders();
      else if(t === 'messages') loadMessages();
      else if(t === 'products') loadProducts();
      else if(t === 'leaflets'){ loadSeries(); loadLeaflets(); }
      else if(t === 'lessons') loadLessons();
    });
  });

  function fmtMoney(n){ return Number(n).toLocaleString('he-IL') + ' ש״ח'; }
  function fmtDate(iso){
    try{
      return new Date(iso).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });
    }catch(e){ return iso; }
  }
  var STATUS_LABELS = { new: 'חדש', contacted: 'נוצר קשר', done: 'טופל' };

  /* ---------- עזרי API כלליים ---------- */
  function apiGet(table, query){
    return validSession().then(function(s){
      return fetch(SUPABASE_URL + '/rest/v1/' + table + '?' + (query || 'select=*'), {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + s.access_token }
      });
    }).then(function(res){
      if(res.status === 401){ clearSession(); document.getElementById('logoutBtn').click(); throw new Error('unauthorized'); }
      if(!res.ok) throw new Error('bad status ' + res.status);
      return res.json();
    });
  }

  function apiPatchStatus(table, id, status){
    return validSession().then(function(s){
      return fetch(SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + id, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + s.access_token,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ status: status })
      });
    });
  }

  /* method: POST/PATCH/DELETE. filter (למשל 'id=eq.xyz') רק ל-PATCH/DELETE */
  function apiWrite(method, table, body, filter){
    return validSession().then(function(s){
      var url = SUPABASE_URL + '/rest/v1/' + table + (filter ? ('?' + filter) : '');
      var headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + s.access_token,
        'Prefer': 'return=representation'
      };
      if(body) headers['Content-Type'] = 'application/json';
      return fetch(url, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined });
    }).then(function(res){
      return res.text().then(function(txt){
        var data = null;
        try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
        if(!res.ok){
          var msg = (data && (data.message || data.msg)) || ('שגיאה (' + res.status + ')');
          throw new Error(msg);
        }
        return data;
      });
    });
  }

  function apiUpload(bucket, folder, file){
    return validSession().then(function(s){
      var ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g,'') || 'bin';
      var key = folder + '/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;
      return fetch(SUPABASE_URL + '/storage/v1/object/' + bucket + '/' + key, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + s.access_token,
          'Content-Type': file.type || 'application/octet-stream'
        },
        body: file
      }).then(function(res){
        if(!res.ok) return res.text().then(function(t){ throw new Error('העלאה נכשלה: ' + t); });
        return SUPABASE_URL + '/storage/v1/object/public/' + bucket + '/' + key;
      });
    });
  }

  function statusSelectHtml(current){
    var opts = ['new','contacted','done'].map(function(v){
      return '<option value="'+v+'"'+(v===current?' selected':'')+'>'+STATUS_LABELS[v]+'</option>';
    }).join('');
    return '<select class="status-select" data-status="'+current+'">'+opts+'</select>';
  }

  function wireStatusSelect(sel, table, id){
    sel.addEventListener('change', function(){
      var newVal = sel.value;
      sel.setAttribute('data-status', newVal);
      apiPatchStatus(table, id, newVal).then(function(res){
        if(res && res.ok){
          var note = sel.parentElement.querySelector('.save-note');
          if(note){
            note.classList.add('show');
            setTimeout(function(){ note.classList.remove('show'); }, 1400);
          }
        }
      }).catch(function(){});
    });
  }

  function esc(s){
    var d = document.createElement('div');
    d.textContent = (s === null || s === undefined) ? '' : String(s);
    return d.innerHTML;
  }

  /* ============================================================
     ניהול תוכן — מוצרים / עלונים / שיעורי תורה
     מבנה גנרי: SCHEMAS מגדיר את השדות לכל סוג תוכן, ומודאל אחד
     (#modalOverlay) בונה טופס דינמי לפי הסכמה עבור הוספה/עריכה.
     ============================================================ */
  var seriesNames = [];

  var SCHEMAS = {
    products: {
      table: 'products',
      titleField: 'title',
      idIsText: true,
      fields: [
        {key:'id', label:'מזהה (אנגלית, ייחודי — לא ניתן לשנות אחרי היצירה)', type:'text', required:true, lockOnEdit:true},
        {key:'title', label:'כותרת מלאה', type:'text', required:true},
        {key:'title_accent', label:'כותרת — חלק ראשון (מודגש)', type:'text'},
        {key:'title_rest', label:'כותרת — חלק שני', type:'text'},
        {key:'price', label:'מחיר (ש״ח)', type:'number', required:true},
        {key:'cover', label:'תמונת שער', type:'file', accept:'image/*', bucket:'products', folder:'covers'},
        {key:'cover_alt', label:'טקסט חלופי לתמונה', type:'text'},
        {key:'description', label:'תיאור', type:'textarea'},
        {key:'link', label:'קישור לעמוד המוצר (למשל book-alt.html)', type:'text'},
        {key:'framed', label:'כרטיס ממוסגר מיוחד', type:'checkbox'},
        {key:'pdf_buy', label:'יש אפשרות רכישת PDF', type:'checkbox'},
        {key:'sort_order', label:'סדר תצוגה', type:'number'}
      ]
    },
    leaflets: {
      table: 'leaflets',
      titleField: 'title',
      fields: [
        {key:'title', label:'כותרת העלון', type:'text', required:true},
        {key:'series', label:'סדרה', type:'select', required:true},
        {key:'date', label:'תאריך (למשל 5786-01)', type:'text'},
        {key:'topic', label:'נושא / פרשה', type:'text'},
        {key:'file', label:'קובץ PDF', type:'file', accept:'.pdf,application/pdf', bucket:'leaflets', folder:'files'},
        {key:'cover', label:'תמונת תצוגה מקדימה', type:'file', accept:'image/*', bucket:'leaflets', folder:'covers'},
        {key:'sort_order', label:'סדר תצוגה', type:'number'}
      ]
    },
    lessons: {
      table: 'lessons',
      titleField: 'title',
      fields: [
        {key:'title', label:'כותרת השיעור', type:'text', required:true},
        {key:'topic', label:'נושא', type:'text'},
        {key:'date', label:'תאריך (YYYY-MM-DD)', type:'text'},
        {key:'file', label:'קובץ שמע (MP3)', type:'file', accept:'.mp3,audio/mpeg', bucket:'lessons', folder:'audio'},
        {key:'sort_order', label:'סדר תצוגה', type:'number'}
      ]
    }
  };

  var modalOverlay = document.getElementById('modalOverlay');
  var modalTitle = document.getElementById('modalTitle');
  var modalForm = document.getElementById('modalForm');
  var modalSave = document.getElementById('modalSave');
  var modalCancel = document.getElementById('modalCancel');
  var modalMsg = document.getElementById('modalMsg');
  var currentType = null;
  var currentRow = null;
  var pendingFiles = {};

  function fieldRowHtml(schema, f, row){
    var val = row ? row[f.key] : '';
    if(f.type === 'checkbox'){
      return '<div class="field-check"><input type="checkbox" id="f_'+f.key+'"'+(val ? ' checked' : '')+'><label for="f_'+f.key+'">'+f.label+'</label></div>';
    }
    if(f.type === 'textarea'){
      return '<div class="field"><label>'+f.label+'</label><textarea id="f_'+f.key+'">'+(val ? esc(val) : '')+'</textarea></div>';
    }
    if(f.type === 'select'){
      var opts = seriesNames.map(function(n){ return '<option value="'+esc(n)+'"'+(n===val?' selected':'')+'>'+esc(n)+'</option>'; }).join('');
      return '<div class="field"><label>'+f.label+'</label><select id="f_'+f.key+'">'+opts+'</select></div>';
    }
    if(f.type === 'file'){
      var current = '';
      if(row && row[f.key]){
        var isImg = /\.(webp|jpe?g|png|gif)$/i.test(row[f.key]);
        current = '<div class="file-current">'+(isImg ? '<img src="'+esc(row[f.key])+'">' : '📎') +
          '<span>קובץ קיים — בחירת קובץ חדש תחליף אותו</span></div>';
      }
      return '<div class="field"><label>'+f.label+'</label><input type="file" id="f_'+f.key+'" accept="'+(f.accept||'')+'">'+current+
        (f.required && !row ? '<div class="field-hint">חובה בעת יצירה</div>' : '')+'</div>';
    }
    var lockAttr = (f.lockOnEdit && row) ? ' disabled' : '';
    return '<div class="field"><label>'+f.label+'</label><input type="'+f.type+'" id="f_'+f.key+'" value="'+esc(val)+'"'+lockAttr+'></div>';
  }

  function openModal(type, row){
    currentType = type;
    currentRow = row || null;
    pendingFiles = {};
    var schema = SCHEMAS[type];
    modalTitle.textContent = (row ? 'עריכת ' : 'הוספת ') + schema.title;
    modalForm.innerHTML = schema.fields.map(function(f){ return fieldRowHtml(schema, f, row); }).join('');
    modalMsg.className = 'modal-msg';
    modalMsg.textContent = '';
    modalSave.disabled = false;
    modalOverlay.classList.add('is-open');
  }
  function closeModal(){
    modalOverlay.classList.remove('is-open');
    currentType = null;
    currentRow = null;
  }
  modalCancel.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function(e){ if(e.target === modalOverlay) closeModal(); });

  modalSave.addEventListener('click', function(){
    var schema = SCHEMAS[currentType];
    var payload = {};
    var missingRequired = null;
    var fileUploads = [];

    schema.fields.forEach(function(f){
      var el = document.getElementById('f_' + f.key);
      if(!el) return;
      if(f.type === 'checkbox'){
        payload[f.key] = el.checked;
      } else if(f.type === 'file'){
        if(el.files && el.files[0]){
          fileUploads.push({ key: f.key, file: el.files[0], bucket: f.bucket, folder: f.folder });
        } else if(f.required && !currentRow){
          missingRequired = f.label;
        }
      } else if(f.type === 'number'){
        payload[f.key] = el.value === '' ? null : Number(el.value);
      } else {
        var v = el.value.trim();
        if(f.required && !v && !el.disabled) missingRequired = f.label;
        if(!el.disabled) payload[f.key] = v || null;
      }
    });

    if(missingRequired){
      modalMsg.textContent = 'נא למלא: ' + missingRequired;
      modalMsg.className = 'modal-msg show';
      return;
    }

    modalSave.disabled = true;
    modalMsg.className = 'modal-msg';

    Promise.all(fileUploads.map(function(u){
      return apiUpload(u.bucket, u.folder, u.file).then(function(url){ payload[u.key] = url; });
    })).then(function(){
      var table = schema.table;
      if(currentRow){
        var filterKey = schema.idIsText ? 'id' : 'id';
        return apiWrite('PATCH', table, payload, filterKey + '=eq.' + encodeURIComponent(currentRow[filterKey]));
      }
      return apiWrite('POST', table, payload);
    }).then(function(){
      modalSave.disabled = false;
      closeModal();
      if(currentType === 'products' || schema === SCHEMAS.products) loadProducts();
      refreshByType(schema);
    }).catch(function(err){
      modalSave.disabled = false;
      modalMsg.textContent = err.message || 'שגיאה בשמירה.';
      modalMsg.className = 'modal-msg show';
    });
  });

  function refreshByType(schema){
    if(schema === SCHEMAS.products) loadProducts();
    else if(schema === SCHEMAS.leaflets) loadLeaflets();
    else if(schema === SCHEMAS.lessons) loadLessons();
  }

  document.querySelectorAll('[data-add]').forEach(function(btn){
    btn.addEventListener('click', function(){ openModal(btn.dataset.add, null); });
  });

  function deleteRow(type, row, idKey){
    var schema = SCHEMAS[type];
    if(!confirm('למחוק את "' + row[schema.titleField] + '"? הפעולה סופית.')) return;
    apiWrite('DELETE', schema.table, null, idKey + '=eq.' + encodeURIComponent(row[idKey])).then(function(){
      refreshByType(schema);
    }).catch(function(err){
      alert('שגיאה במחיקה: ' + (err.message || ''));
    });
  }

  /* ---------- מוצרים ---------- */
  function loadProducts(){
    var list = document.getElementById('productsList');
    list.innerHTML = '<div class="loading-state">טוענת מוצרים...</div>';
    apiGet('products', 'select=*&order=sort_order.asc').then(function(rows){
      document.getElementById('productsCount').textContent = rows.length;
      if(!rows.length){ list.innerHTML = '<div class="empty-state">אין עדיין מוצרים.</div>'; return; }
      list.innerHTML = '';
      rows.forEach(function(p){
        var card = document.createElement('div');
        card.className = 'cms-card';
        card.innerHTML =
          '<div class="cms-card__thumb">'+(p.cover ? '<img src="'+esc(p.cover)+'">' : '<span class="ph">אין תמונה</span>')+'</div>'+
          '<div class="cms-card__body">'+
            '<p class="cms-card__title">'+esc(p.title)+'</p>'+
            '<div class="cms-card__meta">'+fmtMoney(p.price)+' · מזהה: '+esc(p.id)+'</div>'+
            '<div class="cms-card__actions"><button class="edit-btn">עריכה</button><button class="del-btn">מחיקה</button></div>'+
          '</div>';
        card.querySelector('.edit-btn').addEventListener('click', function(){ openModal('products', p); });
        card.querySelector('.del-btn').addEventListener('click', function(){ deleteRow('products', p, 'id'); });
        list.appendChild(card);
      });
    }).catch(function(){
      list.innerHTML = '<div class="empty-state">שגיאה בטעינת המוצרים. נסי לרענן.</div>';
    });
  }

  /* ---------- סדרות עלונים ---------- */
  function loadSeries(){
    var bar = document.getElementById('seriesBar');
    apiGet('leaflet_series', 'select=*&order=sort_order.asc').then(function(rows){
      seriesNames = rows.map(function(r){ return r.name; });
      var html = '<span class="series-bar__label">סדרות עלונים:</span>';
      rows.forEach(function(r){
        html += '<span class="series-chip">'+esc(r.name)+'<button data-del-series="'+esc(r.name)+'">×</button></span>';
      });
      html += '<span class="series-add"><input type="text" id="newSeriesInput" placeholder="שם סדרה חדשה"><button id="addSeriesBtn">הוספה</button></span>';
      bar.innerHTML = html;
      bar.querySelectorAll('[data-del-series]').forEach(function(b){
        b.addEventListener('click', function(){
          var name = b.dataset.delSeries;
          if(!confirm('למחוק את הסדרה "'+name+'"? אפשר רק אם אין לה עלונים.')) return;
          apiWrite('DELETE', 'leaflet_series', null, 'name=eq.' + encodeURIComponent(name)).then(function(){
            loadSeries();
          }).catch(function(err){
            alert('לא ניתן למחוק: יש כנראה עלונים המשויכים לסדרה זו.');
          });
        });
      });
      document.getElementById('addSeriesBtn').addEventListener('click', function(){
        var input = document.getElementById('newSeriesInput');
        var name = input.value.trim();
        if(!name) return;
        apiWrite('POST', 'leaflet_series', { name: name, sort_order: (rows.length + 1) * 10 }).then(function(){
          loadSeries();
        }).catch(function(err){
          alert('שגיאה בהוספת סדרה: ' + (err.message || ''));
        });
      });
    }).catch(function(){
      bar.innerHTML = '<span class="series-bar__label">שגיאה בטעינת הסדרות.</span>';
    });
  }

  function loadLeaflets(){

      document.getElementById('leafletsCount').textContent = rows.length;
      if(!rows.length){ list.innerHTML = '<div class="empty-state">אין עדיין עלונים.</div>'; return; }
      list.innerHTML = '';
      rows.forEach(function(lf){

        card.className = 'cms-card';
        card.innerHTML =
          '<div class="cms-card__thumb">'+(lf.cover ? '<img src="'+esc(lf.cover)+'">' : '<span class="ph">אין תמונה</span>')+'</div>'+
          '<div class="cms-card__body">'+
            '<p class="cms-card__title">'+esc(lf.title)+'</p>'+
            '<div class="cms-card__meta">'+esc(lf.series)+(lf.topic ? ' · '+esc(lf.topic) : '')+'</div>'+

            '<p class="cms-card__title">'+esc(l.title)+'</p>'+

  /* ---------- אתחול ---------- */
  var existing = getSession();
  if(existing){ enterDashboard(); }
})();
